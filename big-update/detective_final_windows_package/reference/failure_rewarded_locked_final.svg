  <text x="960" y="413" text-anchor="middle" fill="#3f434b" font-family="Georgia" font-size="13" font-weight="bold">Вы упустили важное противоречие.</text><text x="960" y="432" text-anchor="middle" fill="#3f434b" font-family="Georgia" font-size="13">Откройте одну улику или повторите дело самостоятельно.</text>
